<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F5F7">
<title>饭碗雷达 · AI 职业体检(JobRadar)</title>
<script>
/* 首屏防闪烁:主脚本前先按记忆/系统偏好设主题 */
(function () {
  try {
    var t = localStorage.getItem("jradar_theme");
    if (t !== "apple" && t !== "linear") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "apple" : "linear";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "apple"); }
})();
</script>
<style>
  /* ===== 双主题 token(苹果浅色为默认,Linear 深色覆写) ===== */
  :root, [data-theme="apple"] {
    color-scheme: light;
    --bg:#F5F5F7;
    --card:rgba(255,255,255,.72);
    --card2:rgba(255,255,255,.92);
    --line:#D2D2D7;
    --tx:#1D1D1F;
    --dim:#6E6E73;
    --acc:#E4572E;
    --acc-ink:#FFFFFF;
    --acc-strong:#0062C6;
    --acc-soft:rgba(0,122,255,.10);
    --acc-fill:rgba(228,87,46,.16);
    --ok:#2E7D32; --warn:#9A6700; --warn-strong:#7A5400; --rsk:#C93400; --dgr:#B42318;
    --sh1:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.08);
    --sh2:0 16px 40px rgba(0,0,0,.14);
    --sh3:0 24px 60px rgba(0,0,0,.20);
    --glass:blur(20px) saturate(180%);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-std:cubic-bezier(.2,.8,.2,1);
    --t-fast:150ms; --t-mid:250ms; --t-slow:350ms;
  }
  [data-theme="linear"] {
    color-scheme: dark;
    --bg:#08090A;
    --card:rgba(22,24,28,.70);
    --card2:rgba(28,30,34,.85);
    --line:#262B33;
    --tx:#EDEFF2;
    --dim:#8B93A7;
    --acc:#E4572E;
    --acc-ink:#FFFFFF;
    --acc-strong:#8C96F0;
    --acc-soft:rgba(94,106,210,.14);
    --acc-fill:rgba(228,87,46,.22);
    --ok:#8FBF6F; --warn:#E8A33D; --warn-strong:#E8A33D; --rsk:#F08A5D; --dgr:#F0615A;
    --sh1:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
    --sh2:0 16px 40px rgba(0,0,0,.6);
    --sh3:0 24px 60px rgba(0,0,0,.7);
    --glass:blur(20px) saturate(160%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1100px 520px at 85% -12%, var(--acc-soft), transparent 62%), var(--bg);
    color: var(--tx);
    font-family: "SF Pro Text","PingFang SC","Inter","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height: 1.65;
    font-variant-numeric: tabular-nums;
    transition: background-color var(--t-mid) var(--ease-std), color var(--t-mid) var(--ease-std);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  header.top h1 { font-size: 26px; letter-spacing: 1px; }
  header.top .tag { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .theme-btn {
    flex-shrink: 0; margin-top: 4px; border-radius: 999px; padding: 8px 16px;
    background: var(--card); border: 1px solid var(--line); color: var(--tx);
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    box-shadow: var(--sh1); cursor: pointer; font-size: 13px;
    transition: transform var(--t-fast) var(--ease-std), box-shadow var(--t-fast) var(--ease-std);
  }
  .theme-btn:hover { transform: translateY(-1px); box-shadow: var(--sh2); }
  .theme-btn:active { transform: scale(.97); }

  .banner {
    background: linear-gradient(90deg, var(--acc-soft), transparent 70%);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px;
    font-size: 13px; color: var(--dim); margin-bottom: 18px;
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    box-shadow: var(--sh1);
  }

  .steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .steps button {
    flex: 1; min-width: 96px; background: var(--card); color: var(--dim);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px;
    cursor: pointer; font-size: 13px;
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    box-shadow: var(--sh1);
    transition: transform var(--t-fast) var(--ease-std), box-shadow var(--t-fast) var(--ease-std), background-color var(--t-fast) var(--ease-std), color var(--t-fast) var(--ease-std), border-color var(--t-fast) var(--ease-std);
  }
  .steps button:hover { transform: translateY(-1px); box-shadow: var(--sh2); }
  .steps button:active { transform: scale(.97); }
  .steps button.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
  .steps button.done { color: var(--acc-strong); font-weight: 600; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    box-shadow: var(--sh1);
    transition: transform var(--t-fast) var(--ease-std), box-shadow var(--t-fast) var(--ease-std);
  }
  .card:hover:not(:focus-within) { transform: translateY(-2px); box-shadow: var(--sh2); }
  .card h2 { font-size: 17px; margin-bottom: 6px; }
  .card .hint { color: var(--dim); font-size: 13px; margin-bottom: 14px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { header.top { flex-wrap: wrap; } header.top h1 { font-size: 22px; } header.top .tag { font-size: 12px; } }

  label.f { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }

  input, select {
    width: 100%; background: var(--card); color: var(--tx);
    border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 14px;
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    transition: border-color var(--t-fast) var(--ease-std), box-shadow var(--t-fast) var(--ease-std);
  }
  input::placeholder { color: var(--dim); opacity: .7; }
  input:focus, select:focus { outline: none; border-color: var(--acc); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  /* 滑块:20px 白圆 + 3px 强调环,hover/active 回弹放大 */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    height: 22px; background: transparent; border: none; padding: 0;
    box-shadow: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; background: var(--line); border-radius: 999px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 3px solid var(--acc);
    margin-top: -7px; box-shadow: var(--sh1);
    transition: transform var(--t-fast) var(--ease-spring);
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.35); }
  input[type=range]::-moz-range-track { height: 6px; background: var(--line); border-radius: 999px; }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 3px solid var(--acc);
    box-shadow: var(--sh1);
    transition: transform var(--t-fast) var(--ease-spring);
  }
  input[type=range]::-moz-range-thumb:hover { transform: scale(1.15); }
  input[type=range]::-moz-range-thumb:active { transform: scale(1.35); }

  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row .lab { width: 200px; font-size: 13px; color: var(--dim); flex-shrink: 0; }
  @media (max-width: 640px) { .row .lab { width: 100%; } }
  .row input[type=range] { flex: 1 1 200px; }
  .row .val { width: 56px; text-align: right; font-size: 14px; color: var(--acc-strong); font-weight: 600; }
  .row .live { margin-left: auto; }
  .live { font-size: 13px; color: var(--dim); margin-top: 4px; }
  .live b { color: var(--tx); }

  .risk0 { color: var(--ok); } .risk1 { color: var(--warn); } .risk2 { color: var(--rsk); } .risk3 { color: var(--dgr); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
  th { background: var(--card2); color: var(--dim); font-weight: 500; }

  .btn {
    display: inline-block; background: var(--card); color: var(--tx);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px;
    cursor: pointer; font-size: 13px; margin-right: 8px; margin-top: 10px;
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    transition: transform var(--t-fast) var(--ease-std), box-shadow var(--t-fast) var(--ease-std), background-color var(--t-fast) var(--ease-std);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--sh2); }
  .btn:active { transform: scale(.97); }
  .btn.primary, .btn-primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
  .btn.primary:hover, .btn-primary:hover { filter: brightness(1.06); }
  .btn.mini { padding: 4px 12px; font-size: 12px; margin-top: 0; border-radius: 999px; }
  .btn.danger, .btn-danger { color: var(--dgr); border-color: var(--dgr); }

  .navbtns { display: flex; justify-content: space-between; margin-top: 16px; }

  .report .diag { font-size: 15px; margin: 8px 0 14px; padding: 12px 14px; background: var(--card2); border-left: 3px solid var(--acc); border-radius: 0 12px 12px 0; }
  .strategy { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; background: var(--card2); }
  .strategy h3 { color: var(--acc-strong); font-size: 15px; margin-bottom: 6px; }
  .planweek { margin: 6px 0; font-size: 13px; }
  .planweek b { color: var(--tx); font-weight: 600; }
  .warn { color: var(--warn); font-size: 13px; }

  /* 岗位对比条:你的分数 vs 岗位平均 */
  .cmpbar { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .cmpbar .t { width: 96px; flex-shrink: 0; color: var(--dim); }
  .cmpbar .tr { flex: 1; height: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .cmpbar i { display: block; height: 100%; width: 0; border-radius: 999px; animation: barGrow var(--t-slow) var(--ease-std) forwards; }
  .cmpbar i.you { background: var(--acc); }
  .cmpbar i.avg { background: var(--dim); }
  .cmpbar .v { width: 64px; text-align: right; font-weight: 600; }
  @keyframes barGrow { to { width: var(--w, 0%); } }

  /* 岗位选择器(combobox) */
  .combo { position: relative; }
  .combo::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; font-size: 12px; }
  .combo-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
    list-style: none; background: var(--card2); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--sh3);
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    max-height: 250px; overflow: auto; padding: 6px;
  }
  .combo-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .combo-list li:hover, .combo-list li.on { background: var(--acc-soft); }
  .combo-list .occ-avg { color: var(--dim); font-size: 12px; }
  .combo-list .occ-avg b { color: var(--tx); }
  .combo-list .occ-cat { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .combo-empty { padding: 8px 10px; font-size: 12px; color: var(--dim); }
  .combo-list .occ-src { color: var(--dim); font-size: 11px; opacity: .85; margin-left: 6px; }

  /* 表格横向滚动容器(移动端) */
  .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
  .tbl-scroll table { margin-top: 0; }

  /* 第 4 步学习项列表头(桌面端;移动端靠占位符辨识) */
  .learn-hd { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); margin: 12px 0 2px; }
  .learn-hd .lh-name { flex: 1; }
  .learn-hd .lh-num { flex-shrink: 0; }
  @media (max-width: 640px) { .learn-hd { display: none; } }

  /* 技能评估卡片(规则引擎,第 3 步) */
  .skill-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: var(--card); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); }
  .skill-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .skill-head input { flex: 1; }
  .skill-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
  .skill-lab { color: var(--dim); font-size: 12px; flex-shrink: 0; width: 96px; }
  .skill-line select { width: auto; min-width: 240px; flex-shrink: 0; }
  .skill-line input[data-role=evnote] { flex: 1; min-width: 180px; }
  .tier {
    background: var(--card2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 12px;
    transition: transform var(--t-fast) var(--ease-std), background-color var(--t-fast) var(--ease-std), color var(--t-fast) var(--ease-std);
  }
  .tier:hover { transform: translateY(-1px); }
  .tier:active { transform: scale(.97); }
  .tier.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
  .skill-calc { font-size: 12px; color: var(--dim); border-top: 1px dashed var(--line); padding-top: 8px; }
  .skill-calc b { color: var(--tx); }

  /* 待学推导(第 4 步) */
  .derive { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; background: var(--card2); }
  .derive h3 { font-size: 15px; color: var(--acc-strong); margin-bottom: 6px; }
  .derive-list { display: flex; flex-direction: column; gap: 8px; }
  .derive-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .derive-name { font-size: 13px; font-weight: 600; min-width: 140px; }
  .derive-meta { font-size: 12px; color: var(--dim); flex: 1; }
  .src-chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .src-chip[data-src="缺口"] { background: var(--acc-soft); color: var(--acc-strong); }
  .src-chip[data-src="迁移"] { background: rgba(232,163,61,.14); color: var(--warn-strong); }
  .src-chip[data-src="回补"] { background: rgba(212,100,69,.12); color: var(--rsk); }
  .src-chip[data-src="默认"] { background: var(--card2); color: var(--dim); border: 1px solid var(--line); }
  .unc { color: var(--dim); font-size: 12px; font-style: normal; }


  svg { display: block; margin: 6px auto; }
  .rg-ring { stroke: var(--line); fill: none; }
  .rg-cross { stroke: var(--line); opacity: .55; fill: none; }
  .rg-sweep { fill: var(--acc-soft); }
  .rg-poly {
    fill: var(--acc-fill); stroke: var(--acc); stroke-width: 2; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; fill-opacity: 0;
    animation: radarTrace 600ms var(--ease-std) forwards;
  }
  .rg-dot { fill: var(--acc); opacity: 0; animation: dotIn var(--t-fast) var(--ease-std) forwards; }
  .rg-lab { fill: var(--dim); }
  @keyframes radarTrace { to { stroke-dashoffset: 0; fill-opacity: 1; } }
  @keyframes dotIn { to { opacity: 1; } }

  footer { color: var(--dim); font-size: 12px; margin-top: 30px; border-top: 1px solid var(--line); padding-top: 14px; }

  /* View Transitions:步骤切换交叉淡入淡出 */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--t-mid); animation-timing-function: var(--ease-std); }

  /* 动效降级:偏好减弱动态时全部关闭,且保证动画终态可见 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    .rg-poly { stroke-dashoffset: 0; fill-opacity: 1; }
    .rg-dot { opacity: 1; }
    .cmpbar i { width: var(--w, 0%); }
  }

  @media print {
    body { background: #fff; color: #111; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .card, .banner { border: 1px solid #999; background: #fff; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .steps, .navbtns, .btn, .banner, .theme-btn { display: none; }
    .combo-list { display: none; }
    .card:hover:not(:focus-within) { transform: none; }
    .cmpbar i, .rg-poly, .rg-dot { animation: none; }
    .cmpbar i { width: var(--w, 0%); }
    .rg-poly { stroke-dashoffset: 0; fill-opacity: 1; }
    .rg-dot { opacity: 1; }
    svg { max-width: 320px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>饭碗雷达 · AI 职业体检</h1>
      <div class="tag">「饭碗还稳不稳,扫一扫就知道。」JobRadar · 计算在浏览器本地完成,数据不上传</div>
    </div>
    <button id="theme_toggle" class="theme-btn" type="button" title="切换浅色/深色主题" aria-label="切换主题">深色模式</button>
  </header>
  <div class="banner">五步扫一遍你的饭碗:基本信息 → 暴露度体检 → 技能资产 → 学习选项 → 报告与计划。暴露度 = 你的岗位任务被 AI 覆盖的程度(0~100)。饭碗雷达只给概率与路径,不给预言。</div>
  <div class="steps" id="steps"></div>
  <div id="pane"></div>
  <footer>饭碗雷达 JobRadar · 数据只在本机计算,不上传。</footer>
</div>
<script>
"use strict";

/* ---------- 状态 ---------- */
var S = {
  age: 30, salary: 15000, savings: 200000, hours: 10, budget: 500,
  industry: "", job: "", jobAvg: null, years: 5, goal: "grow", nick: "", city: "tier2", move: "free",
  r: 50, c: 30, i: 30, d: 40,
  aiFreq: 40, learnHist: "mid",
  skills: [],
  learns: []
};

/* ============ 技能评估规则引擎(贺兰评估稿 v1,第 0–6 节) ============
   四条铁律:预设降级为示例 · 每分必附证据 · 纯规则查找表(同输入必同输出)· 市场信号先于自评。
   skills[i] = { name, tier(30/60/85,0=未选), evidence(""/none/tpl/done/paid),
                 evidenceNote, signal(""/hunt/hire/none), preset(预设键或 ""),
                 scarce(稀缺基准分:预设默认或 40), calibrated(证据题已答) }
   learns[i] = { name, hours, cost, gain, source(缺口/迁移/回补/默认/""), gainBand([min,max]/null), gainNote } */
function blankSkill() { return { name: "", tier: 0, evidence: "", evidenceNote: "", signal: "", preset: "", scarce: 40, calibrated: false }; }
function blankLearn() { return { name: "", hours: 100, cost: 1000, gain: 20000, source: "", gainBand: null, gainNote: "" }; }

/* 证据档 → 熟练度封顶(第 2.2 节):无交付物 30 / 依赖模板 60 / 独立交付被认可 ≥70 / 变现 ≥85 */
var EV_TIER = { "none": 30, "tpl": 60, "done": 70, "paid": 85 };
var EV_LABEL = {
  "none": "无成型交付物(封顶 30)",
  "tpl": "依赖模板/他人交付(封顶 60)",
  "done": "独立交付且被认可(≥70)",
  "paid": "赚过岗位外钱(允许 ≥85,稀缺 ≥70 成立)"
};

/* 预设降级为示例:新默认分(未验证保守值)+ 一句依据(第 5 节全表 12 项) */
var PRESET_SKILLS = [
  { name: "办公软件", prof: 50, scarce: 30, note: "人人会用,区分度在函数/宏/自动化" },
  { name: "写作", prof: 50, scarce: 40, note: "会写≠能写;能写结构化/带货文案才稀缺" },

/* ---------- 校准规则(纯函数,同输入必同输出) ---------- */
function normSkill(sk) {
  sk = sk || blankSkill();
  var n = {
    name: sk.name || "",
    tier: (sk.tier === 30 || sk.tier === 60 || sk.tier === 85) ? sk.tier : 0,
    evidence: EV_TIER[sk.evidence] ? sk.evidence : "",
    evidenceNote: sk.evidenceNote || "",
    signal: (sk.signal === "hunt" || sk.signal === "hire" || sk.signal === "none") ? sk.signal : "",
    preset: sk.preset || "",
    scarce: Number(sk.scarce) > 0 ? Math.min(100, Math.round(Number(sk.scarce))) : 40,
    calibrated: false
  };
  n.calibrated = n.evidence !== "";
  /* 旧数据迁移:老 prof 映射到档位,无证据一律视为未校准 */
  if (!sk.tier && sk.prof != null && !sk.calibrated) {
    var p = Number(sk.prof) || 0;
    n.tier = p >= 85 ? 85 : p >= 60 ? 60 : p >= 30 ? 30 : 0;
  }
  return n;
}
function effTier(sk) { return sk.tier > 0 ? sk.tier : 60; }
function prevTier(v) { return v <= 30 ? 30 : v <= 60 ? 30 : 60; } /* 降一档:85→60,60→30,30 触底 */
/* 熟练度 = min(自评档, 证据档);年龄修正:≤28 且自评≥85 且证据<70 → 结果再降一档;≥40 且证据≥70 不降(第 2.3/2.4 节) */
function profOf(sk) {
  var n = normSkill(sk);
  if (n.calibrated) {
    var base = Math.min(effTier(n), EV_TIER[n.evidence]);
    if (Number(S.age) <= 28 && effTier(n) >= 85 && EV_TIER[n.evidence] < 70) base = prevTier(base);
    return base;
  }
  /* 未校准:预设显示保守默认分;自评 85 按 60 计(第 0.2 节) */
  if (n.preset && PRESET_BY_NAME[n.preset]) return PRESET_BY_NAME[n.preset].prof;
  return Math.min(effTier(n), 60);
}
/* 稀缺度:信号题决定,变现门把关(第 2 节)。都无/未作答 → 岗位族基准(保守下限);稀缺≥70 只在赚过岗位外钱时成立 */
function scarcityOf(sk) {
  var n = normSkill(sk);
  var base = n.scarce;
  var s = base;
  if (n.signal === "hunt") s = 60;
  else if (n.signal === "hire") s = Math.min(100, base + 10);
  if (n.calibrated || n.signal !== "") {
    if (n.evidence !== "paid") s = Math.min(s, 69); /* 变现门:稀缺 ≥70 只在赚过岗位外钱时成立 */
  }
  return s;
}
function evidenceLabel(sk) { var n = normSkill(sk); return n.calibrated ? (EV_LABEL[n.evidence] + (n.evidenceNote ? ":" + n.evidenceNote : "")) : ""; }
function scarcityLabel(sk) {
  var n = normSkill(sk);
  if (n.signal === "hunt") return "近一年有猎头/同行找过(≥60)";
  if (n.signal === "hire") return "我司/我行招人周期明显长(基准上浮)";
  if (n.signal === "none") return "无市场信号,取岗位族基准(保守下限)";
  return "岗位族基准(未验证)";
}
/* 收益参考区间:名称精确/包含匹配(长键优先);无表 → null(不设上限) */
function bandFor(name) {
  var n = String(name || "").trim();
  if (!n) return null;
  var keys = Object.keys(GAIN_BANDS).sort(function (a, b) { return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    if (n === keys[i] || n.indexOf(keys[i]) >= 0) return GAIN_BANDS[keys[i]];
  }
  return null;
}
/* 超出参考区间上限且未附来源 → 0.5 折计入(第 4.4 节) */
function effectiveGain(l) {
  var g = Math.max(0, Number(l.gain) || 0);
  var band = (l.gainBand && l.gainBand.length === 2) ? l.gainBand : bandFor(l.name);
  if (band && g > band[1] && !String(l.gainNote || "").trim()) return Math.round(g * 0.5);
  return g;
}
/* 暴露度缺口技能(第 4.1 节):按岗位/行业关键词命中任务簇,R 占比决定取几项 */
function gapSkills() {
  var text = (String(S.job || "") + " " + String(S.industry || "")).toLowerCase();
  var row = null;
  for (var i = 0; i < TASK_TO_SKILL.length && !row; i++) {
    for (var j = 0; j < TASK_TO_SKILL[i].kw.length; j++) {
      if (text.indexOf(TASK_TO_SKILL[i].kw[j]) >= 0) { row = TASK_TO_SKILL[i]; break; }
    }
  }
  if (!row) row = { kw: [], skills: ["数据分析", "AI 工作流"] };
  var n = Number(S.r) >= 50 ? 2 : Number(S.r) >= 30 ? 1 : 0;
  return row.skills.slice(0, n);
}
/* 岗位族短板(默认补充用):命中族的技能 − 用户已列技能,取第一项 */
function familyShortSkill() {
  var text = (String(S.job || "") + " " + String(S.industry || "")).toLowerCase();
  var have = {};
  S.skills.forEach(function (s) { if (s.name) have[String(s.name).trim()] = 1; });
  for (var i = 0; i < FAMILY_SKILLS.length; i++) {
    var hit = false;
    for (var j = 0; j < FAMILY_SKILLS[i].kw.length; j++) { if (text.indexOf(FAMILY_SKILLS[i].kw[j]) >= 0) { hit = true; break; } }
    if (!hit) continue;
    for (var k = 0; k < FAMILY_SKILLS[i].skills.length; k++) {
      if (!have[FAMILY_SKILLS[i].skills[k]]) return FAMILY_SKILLS[i].skills[k];
    }
    return null; /* 族内技能已齐 */
  }
  return "数据分析";
}
function hasName(list, name) {
  var n = String(name).trim().toLowerCase();
  for (var i = 0; i < list.length; i++) { if (String(list[i].name).trim().toLowerCase() === n) return true; }
  return false;
}
/* 待学推导(第 4 节):(缺口 ∪ 迁移) − 已会(证据≥60);证据档≤30(档位制下最低档)视为假会优先回补;不足 2 项补默认 */
function deriveLearnCandidates() {
  var e = calcExposure();
  var dims = radar();
  var st = decideStrategy(e, dims[0].v, Number(S.age), Number(S.hours), S.move);
  var pool = [];
  gapSkills().forEach(function (s) { pool.push({ name: s, source: "缺口" }); });
  (MIGRATION_SKILLS[st.code] || []).forEach(function (s) { pool.push({ name: s, source: "迁移" }); });
  var known = {}, weak = [];
  S.skills.forEach(function (sk) {
    if (!sk.name) return;
    var n = normSkill(sk);
    if (n.calibrated && EV_TIER[n.evidence] >= 60) known[String(n.name).trim()] = 1;
    else if (n.calibrated && profOf(n) <= 30) weak.push(String(n.name).trim());
  });
  var out = [];
  weak.forEach(function (nm) { if (!hasName(out, nm)) out.push({ name: nm, source: "回补" }); });
  pool.forEach(function (p) {
    if (known[String(p.name).trim()]) return;
    if (hasName(out, p.name)) return;
    out.push(p);
  });
  if (out.length < 2) {
    if (!hasName(out, "AI 工作流改造")) out.push({ name: "AI 工作流改造", source: "默认" });
    var short = familyShortSkill();
    if (short && !hasName(out, short) && out.length < 2) out.push({ name: short, source: "默认" });
  }
  return out.slice(0, 6);
}

  S.skills = (S.skills || []).map(function (sk) { return normSkill(sk); });

/* ---------- 岗位选择器数据接口(occupations.json) ----------
   期望格式(与 occupations.json v1 约定,两种都兼容):
   { "version": 1, "source": "...", "occupations": [ ... ] }  ← 实际交付格式(包装对象)
   或裸数组 [ ... ]。每条:
   { "name": "会计", "avgExposure": 90, "category": "财务", "dims": {...}, "keySkills": [...], "source": "..." }
   name = 岗位名(必填);avgExposure = 该岗位平均 AI 暴露度 0~100(必填,缺失显示 —);
   category = 分类(可选,参与搜索);dims/keySkills/source 留作后续版本(职业详情)使用。
   文件不存在或 fetch 失败 → 静默降级为普通手输文本框,报告页对比位预留。 */
var OCCUPATIONS = null;      /* 归一化后的岗位数组 */
var OCC_STATE = "loading";   /* loading | ready | none */

function normalizeOcc(list) {
  if (list && Array.isArray(list.occupations)) list = list.occupations;
  if (!Array.isArray(list)) return null;
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var o = list[i];
    if (!o || typeof o !== "object") continue;
    var name = o.name || o.title || o.job;
    if (!name) continue;
    var raw = o.avgExposure != null ? Number(o.avgExposure) : (o.exposure != null ? Number(o.exposure) : Number(o.avg));
    var e = isNaN(raw) ? null : Math.round(raw);
    out.push({ name: String(name), avgExposure: e, category: o.category || "", source: o.source || "" });
  }
  return out.length ? out : null;
}

/* 岗位条目来源 → 紧凑标签(选择器/报告展示用) */
function shortSource(s) {
  s = String(s || "");
  if (s.indexOf("管理世界") >= 0) return "管理世界 2025";
  if (s.indexOf("Anthropic") >= 0) return "Anthropic 2026";
  if (s.indexOf("Felten") >= 0) return "Felten 2021";
  if (s.indexOf("IMF") >= 0) return "IMF 2026";
  return "估算";
}

function loadOccupations() {
  try {
    fetch("occupations.json", { cache: "no-store" }).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (d) {
      OCCUPATIONS = normalizeOcc(d);
      OCC_STATE = OCCUPATIONS ? "ready" : "none";
      renderJobHint();
    }).catch(function () {
      OCC_STATE = "none";
      renderJobHint();
    });
  } catch (e) { OCC_STATE = "none"; }
}

function renderJobHint(animate) {
  var h = document.getElementById("job_hint");
  if (!h) return;
  var html = "";
  if (OCC_STATE === "loading") {
    html = "职业库加载中…";
  } else if (S.job && S.jobAvg != null) {
    html = "「" + esc(S.job) + "」平均暴露度:<b data-count=" + S.jobAvg + ">" + S.jobAvg + "</b> / 100(occupations.json 样本)· 报告页将给出你的分数与岗位平均对比。";
  } else if (S.job) {
    html = "「" + esc(S.job) + "」" + (OCC_STATE === "ready" ? "未收录平均暴露度:已按手输记录," : "已记录,") + "报告页对比位已预留。";
  } else {
    html = OCC_STATE === "none"
      ? "可直接手输岗位;接入 occupations.json 后支持搜索选择与岗位平均对比。"
      : "输入岗位名可搜索职业库(支持手输);岗位用于报告中的平均暴露度对比与缺口技能推导。";

}

function setupJobCombo() {
  var input = document.getElementById("in_job");
  var list = document.getElementById("job_list");
  if (!input || !list) return;
  var open = false, active = -1, shown = [];

  function close() {
    open = false; active = -1; shown = [];
    list.hidden = true; list.innerHTML = "";
    input.setAttribute("aria-expanded", "false");
  }
  function openList() {
    if (!OCCUPATIONS) return;
    var q = (input.value || "").trim().toLowerCase();
    shown = OCCUPATIONS.filter(function (o) {
      return !q || o.name.toLowerCase().indexOf(q) >= 0 || (o.category && o.category.toLowerCase().indexOf(q) >= 0);
    }).slice(0, 10);
    list.innerHTML = "";
    if (!shown.length) {
      var empty = document.createElement("li");
      empty.className = "combo-empty";
      empty.textContent = "职业库中没有匹配项:直接手输即可。";
      list.appendChild(empty);
    } else {
      shown.forEach(function (o, idx) {
        var li = document.createElement("li");
        li.setAttribute("role", "option");
        li.setAttribute("data-idx", String(idx));
        li.innerHTML = "<span>" + esc(o.name) + (o.category ? "<span class=occ-cat>" + esc(o.category) + "</span>" : "") + (o.source ? "<span class=occ-src>" + esc(shortSource(o.source)) + "</span>" : "") + "</span><span class=occ-avg>平均暴露度 <b>" + (o.avgExposure == null ? "—" : o.avgExposure) + "</b></span>";
        li.addEventListener("mousedown", function (ev) { ev.preventDefault(); select(shown[idx]); });
        list.appendChild(li);
      });
    }
    open = true; active = -1;
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
  }
  function setActive(delta) {
    if (!shown.length) return;
    active = (active + delta + shown.length) % shown.length;
    var lis = list.querySelectorAll("li[data-idx]");
    for (var i = 0; i < lis.length; i++) {
      lis[i].className = Number(lis[i].getAttribute("data-idx")) === active ? "on" : "";
    }
    var target = list.querySelector("li[data-idx='" + active + "']");
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "nearest" });
  }
  function select(o) {
    S.job = o.name;
    S.jobAvg = o.avgExposure;
    input.value = o.name;
    save();
    close();
    renderJobHint(true);
  }

  input.addEventListener("input", function () {
    S.job = input.value; S.jobAvg = null; save();
    renderJobHint();
    if (OCCUPATIONS) openList();
  });
  input.addEventListener("focus", openList);
  input.addEventListener("keydown", function (ev) {
    if (!open || !OCCUPATIONS) {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") openList();
      return;
    }
    if (ev.key === "ArrowDown") { ev.preventDefault(); setActive(1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); setActive(-1); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (active >= 0 && shown[active]) select(shown[active]); else if (shown.length) select(shown[0]); }
    else if (ev.key === "Escape") { close(); }
    else if (ev.key === "Tab") { close(); }
  });
  function outHandler(ev) {
    var inside = false, t = ev.target;
    while (t && t !== document) {
      if (t === input || t === list) { inside = true; break; }
      t = t.parentNode;
    }
    if (!inside) close();
  }
  if (document.__jobOut) document.removeEventListener("click", document.__jobOut);
  document.__jobOut = outHandler;
  document.addEventListener("click", outHandler);
}

/* ---------- 数字 count-up(rAF + easeOutExpo 600ms) ---------- */
function animateCounts(root) {
  var els = (root || document).querySelectorAll("[data-count]");
  var reduce = reduceMotion();
  for (var i = 0; i < els.length; i++) {
    (function (node) {
      var target = parseFloat(node.getAttribute("data-count"));
      if (isNaN(target)) return;
      if (reduce) { node.textContent = String(Math.round(target)); return; }
      var t0 = null;
      function step(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / 600);
        var v = target * (1 - Math.pow(2, -10 * p)); /* easeOutExpo */
        node.textContent = String(Math.round(v));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })(els[i]);
  }
}

/* ---------- 计算模型(与 PLANNER.md 对齐) ---------- */
function calcExposure() {
  return 0.5 * S.r + 0.2 * (100 - S.c) + 0.15 * (100 - S.i) + 0.15 * (100 - S.d);
}
function riskLevel(e) {
  if (e < 35) return { t: "信号稳定", cls: "risk0", note: "饭碗稳,把雷达扫出来的优势再放大。" };
  if (e < 55) return { t: "信号偏弱", cls: "risk1", note: "出现干扰,时间窗 2~3 年,提前动手。" };
  if (e < 75) return { t: "红色预警", cls: "risk2", note: "裂缝已经出现:先补最容易被覆盖的那一块。" };
  return { t: "信号丢失", cls: "risk3", note: "这碗饭正在被重构,别恋战:最短路径换碗。" };
}
function avg(list) { if (!list.length) return 0; var s = 0; for (var i = 0; i < list.length; i++) s += list[i]; return s / list.length; }
function radar() {
  /* 专业深度 = 校准项全额 + 未校准项 ×0.9 加权平均(评估稿第 3 节);市场稀缺 = 信号校准后稀缺度均值 */
  var wsum = 0, psum = 0, scs = [];
  for (var i = 0; i < S.skills.length; i++) {
    var sk = normSkill(S.skills[i]);
    if (!sk.name) continue;
    var w = sk.calibrated ? 1 : 0.9;
    wsum += w;
    psum += profOf(sk) * w;
    scs.push(scarcityOf(sk));
  }
  var depth = wsum ? psum / wsum : 50;
  var scarce = scs.length ? avg(scs) : 50;
  var e = calcExposure();
  var aiLev = 0.5 * S.aiFreq + 0.5 * (100 - e);
  var elastic = 0.5 * Math.min(100, S.hours / 14 * 100)
    + 0.3 * Math.max(0, 100 - (S.age - 25) * 2)
    + 0.2 * (S.learnHist === "high" ? 80 : S.learnHist === "mid" ? 55 : 30);
  var months = S.salary > 0 ? S.savings / S.salary : 0;
  var buffer = 0.6 * Math.min(100, months / 24 * 100) + 0.4 * Math.min(100, S.budget / 2000 * 100);
  return [
    { k: "专业深度", v: Math.round(depth) },
    { k: "AI 杠杆", v: Math.round(aiLev) },
    { k: "市场稀缺", v: Math.round(scarce) },
    { k: "学习弹性", v: Math.round(elastic) },
    { k: "财务缓冲", v: Math.round(buffer) }
  ];
}

function calcRoi() {
  var out = [];
  for (var i = 0; i < S.learns.length; i++) {
    var l = S.learns[i];
    if (!l.name) continue;
    var h = Math.max(1, Number(l.hours) || 1);
    var c = Math.max(0, Number(l.cost) || 0);
    var g = Math.max(0, Number(l.gain) || 0);
    var eg = effectiveGain(l); /* 超参考区间上限未附来源 → 0.5 折 */
    var moneyRoi = (eg - c) / Math.max(c, 1);
    var timeRoi = (eg - c) / (h * 12);
    var heavy = h * 12 > S.hours * 52 * 0.4;
    out.push({ name: l.name, hours: h, cost: c, gain: g, effGain: eg, discounted: eg < g, moneyRoi: moneyRoi, timeRoi: timeRoi, heavy: heavy });
  }
  out.sort(function (a, b) { return b.timeRoi - a.timeRoi; });
  return out;
}

function skillCalcText(sk) {
  var n = normSkill(sk);
  var p = profOf(n);
  var s = scarcityOf(n);
  var parts = ["熟练度 <b>" + p + "</b>", "稀缺度 <b>" + s + "</b>"];
  if (n.calibrated) {
    parts.push("依据:" + evidenceLabel(n) + " · 稀缺:" + scarcityLabel(n));
    if (n.evidence !== "paid" && (n.signal === "hunt" ? 60 : n.signal === "hire" ? Math.min(100, n.scarce + 10) : n.scarce) >= 70) parts.push("(稀缺 ≥70 需赚过岗位外钱,已封顶 69)");
  } else if (n.preset && PRESET_BY_NAME[n.preset]) {
    parts.push("默认值,未校准(预设示例:" + PRESET_BY_NAME[n.preset].note + ")");
  } else {
    parts.push("自评,未校准(进专业深度按 0.9 折)");
  }
  return parts.join(" · ");
}

/* 雷达图:同心扫描圈 + 十字线 + 扫描扇面 + 五维数据面(polygon 描线动画)+ 信号点 */
function radarSvg(dims) {
  /* viewBox 加安全边距:旧值 340×320 下五维标签被裁切(顶部/左/右出界) */
  var cx = 190, cy = 170, R = 110, N = dims.length;
  var rings = "";
  for (var lv = 1; lv <= 4; lv++) {
    var r2 = R * lv / 4;
    rings += "<circle class=rg-ring cx=" + cx + " cy=" + cy + " r=" + r2.toFixed(1) + " stroke-width=1></circle>";
  }
  var cross = "<path class=rg-cross d='M" + (cx - R) + " " + cy + " H" + (cx + R) + " M" + cx + " " + (cy - R) + " V" + (cy + R) + "' stroke-width=1></path>";
  var sweep = "<path class=rg-sweep d='M" + cx + " " + cy + " L" + (cx + R) + " " + cy + " A" + R + " " + R + " 0 0 1 " + (cx + R * 0.707).toFixed(1) + " " + (cy - R * 0.707).toFixed(1) + " Z'></path>";
  var pts = [];
  for (var i = 0; i < N; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / N;
    var rr = R * (dims[i].v / 100);
    pts.push([cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)]);
  }
  var poly = "";
  for (var j = 0; j < pts.length; j++) poly += (j ? " " : "") + pts[j][0].toFixed(1) + "," + pts[j][1].toFixed(1);
  var labels = "";
  for (var m = 0; m < N; m++) {
    var a3 = -Math.PI / 2 + m * 2 * Math.PI / N;
    var lx = cx + (R + 40) * Math.cos(a3);
    var ly = cy + (R + 40) * Math.sin(a3);
    labels += "<text class=rg-lab x=" + lx.toFixed(0) + " y=" + ly.toFixed(0) + " font-size=12 text-anchor=middle>" + dims[m].k + "(<tspan data-count=" + dims[m].v + ">" + dims[m].v + "</tspan>)</text>";
  }
  var dots = "";
  for (var n = 0; n < pts.length; n++) dots += "<circle class=rg-dot cx=" + pts[n][0].toFixed(1) + " cy=" + pts[n][1].toFixed(1) + " r=3.5 style='animation-delay:" + (430 + n * 70) + "ms'></circle>";
  return "<svg width=380 height=340 viewBox='0 0 380 340' role=img aria-label=五维雷达图>" + rings + cross + sweep + "<polygon class=rg-poly pathLength=100 points=" + poly + "></polygon>" + dots + labels + "</svg>";
}

function roiTable(rows) {
  if (!rows.length) return "<div class=warn>未填写学习项:回到第 4 步,至少填一项。</div>";

    var gainTxt = r.gain + (r.discounted ? " <span class=warn>→ 按 " + r.effGain + " 计(超参考上限未附来源,0.5 折)</span>" : "");
    h += "<tr><td>" + (i + 1) + "</td><td>" + esc(r.name) + (r.heavy ? " <span class=warn>(耗时偏重)</span>" : "") + "</td><td>" + r.hours + "</td><td>" + r.cost + "</td><td>" + gainTxt + "</td><td>" + r.timeRoi.toFixed(0) + "</td><td>" + (r.moneyRoi >= 0 ? r.moneyRoi.toFixed(1) : "负") + "</td></tr>";

    var n = normSkill(sk);
    if (!n.name) return;
    (n.calibrated ? cal : unc).push(n);
  });
  function skTable(rows) {
    if (!rows.length) return "<div class=planweek style=color:var(--dim)>未填写技能:回到第 3 步补充。</div>";
    var t = "<table><tr><th>技能</th><th>熟练度</th><th>稀缺度</th><th>依据</th></tr>";
    rows.forEach(function (n) {
      var basis = n.calibrated
        ? esc(evidenceLabel(n)) + " · 稀缺:" + esc(scarcityLabel(n))
        : "<span class=unc>" + (n.preset && PRESET_BY_NAME[n.preset] ? "默认值,未校准(示例:" + esc(PRESET_BY_NAME[n.preset].note) + ")" : "自评,未校准") + "</span>";
      t += "<tr><td>" + esc(n.name) + "</td><td>" + profOf(n) + "</td><td>" + scarcityOf(n) + "</td><td>" + basis + "</td></tr>";
    });
    return "<div class=tbl-scroll>" + t + "</table></div>";
  }
  skbox.innerHTML = "<h3>已会(校准后)</h3>" + skTable(cal) +
    (unc.length ? "<h3 style='margin-top:12px'>未校准(自评)</h3><div class=planweek style=color:var(--dim)>以下未做证据题:显示保守默认分,进专业深度时按 0.9 折计入。</div>" + skTable(unc) : "");
  c.appendChild(skbox);

  var stbox = el("div", "strategy");
  stbox.innerHTML = "<h3>建议路径:" + st.name + "</h3><div>" + st.why + "</div><div style=margin-top:8px>" + st.acts.map(function (a) { return "<div class=planweek>· " + a + "</div>"; }).join("") + "</div>";
  c.appendChild(stbox);
  var where = el("div", "strategy");
  var lowOcc = OCCUPATIONS
    ? OCCUPATIONS.filter(function (o) { return o.avgExposure != null; }).slice().sort(function (a, b) { return a.avgExposure - b.avgExposure; }).slice(0, 5)
    : [];
  where.innerHTML = "<h3>转去哪:低暴露参照岗位(" + (lowOcc.length ? "内置职业库实测均值" : "内置小表,职业库未加载") + ")</h3>" +
    "<div class=planweek>参照 Anthropic《Labor market impacts of AI》(2026-03) 与张丹丹等《管理世界》(2025) 的低暴露职业方向,同信号人群常看的岗位:</div>" +
    (lowOcc.length
      ? lowOcc.map(function (o) { return "<div class=planweek>· " + esc(o.name) + "(平均暴露度 <b>" + o.avgExposure + "</b>/100 · " + esc(o.category) + (o.source ? " · " + esc(shortSource(o.source)) : "") + ")</div>"; }).join("")
      : "<div class=planweek>· 手艺人型:厨师 / 维修技工 / 美发 / 缝纫</div>" +
        "<div class=planweek>· 照料与现场型:护理 / 家政 / 保育 / 健身教练</div>" +
        "<div class=planweek>· 现场服务型:保安 / 物业 / 消防 / 驾驶员</div>") +
    "<div class=planweek style=color:var(--dim)>提示:低暴露不等于高薪,动手前用第 4 步学习排序验证投入产出。</div>";
  c.appendChild(where);

  c.appendChild(el("h3", "", "学习排序(按时间 ROI)"));
  var roinote = el("div", "hint");
  roinote.innerHTML = "时间 ROI =(预期年增收 − 金钱成本)÷(每月小时 × 12);金钱 ROI =(预期年增收 − 金钱成本)÷ 金钱成本。收益超出参考区间上限且未附来源 → 按 0.5 折计入(附收益依据后按全额)。";
  c.appendChild(roinote);
  var tbl = el("div", "");
  tbl.innerHTML = roiTable(rois);
  c.appendChild(tbl);

  c.appendChild(el("h3", "", "90 天实验计划"));
  var pl = el("div", "");
  for (var w = 0; w < weeks.length; w++) pl.innerHTML += "<div class=planweek><b>" + weeks[w].w + "</b>:<span style=color:var(--dim)> " + weeks[w].t + "</span></div>";
  c.appendChild(pl);

  var warnBox = el("div", "");
  if (Number(S.hours) < 5) warnBox.innerHTML += "<div class=warn>⚠ 每周可投入不足 5 小时:先把改造现有工作流作为唯一重点,学习项压缩到 1 个。</div>";
  if (Number(S.budget) < 100 && S.learns.some(function (x) { return Number(x.cost) > 0; })) warnBox.innerHTML += "<div class=warn>⚠ 预算近零:优先选择成本为 0 的学习项(免费工具/官方文档/开源社区)。</div>";
  if (top && top.heavy) warnBox.innerHTML += "<div class=warn>⚠ 排序第一的学习项耗时超过全年可投入的 40%:建议拆成 2~3 个小里程碑分阶段投入。</div>";
  c.appendChild(warnBox);
  var src = el("div", "hint");
  src.innerHTML = "数据与口径:暴露度权重(0.5/0.2/0.15/0.15)与阈值(35/55/75)为初版设定,参照 Anthropic《Labor market impacts of AI》(2026-03) 任务暴露框架;岗位平均暴露度来自 occupations.json(条目级来源:张丹丹等《管理世界》2025 DWA 法 / Anthropic 职业榜观测 / Felten 等 SMJ 2021 / IMF 2026),职业库未加载时对比位留空。饭碗雷达只给概率与路径,不给预言。";
  c.appendChild(src);

  var tools = el("div", "");
  tools.innerHTML = "<button class=btn-primary id=btn_save>保存报告</button><button class=btn id=btn_share>分享报告(脱敏)</button><button class=btn-danger id=btn_reset>清空重来</button>";
  c.appendChild(tools);
  var priv = el("div", "hint");
  priv.innerHTML = "分享报告为脱敏版:只含信号、路径与计划,不含收入、存款、年龄、岗位与昵称等任何个人信息。本报告生成于 " + fmtTime(new Date().toISOString()) + ",所有输入已自动保存在本机浏览器(仅本设备,换设备不互通)。4 周后重测对比,参数变化比绝对值更有意义。";
  c.appendChild(priv);

  c.appendChild(el("div", "hint", "本报告基于你的自评,仅供参考,不构成职业决策依据。"));
  animateCounts(c);
  return c;
}

function reportObj() {
  var e = calcExposure();
  var rk = riskLevel(e);
  var dims = radar();
  var st = decideStrategy(e, dims[0].v, Number(S.age), Number(S.hours), S.move);
  var rois = calcRoi();
  var weeks = genPlan(st, rois[0]);
  return { generatedAt: new Date().toISOString(), exposure: Math.round(e), risk: rk.t, radar: dims, strategy: st, roi: rois, plan: weeks, input: S };
}

  h += "<h1>" + title + "</h1>";

      : "<div class=note>岗位对比:「" + esc(S.job) + "」未在职业库中,对比位预留。</div>";
  }

  h += radarSvg(o.radar);
  if (!stripped) {

    var cal = [], unc = [];
    S.skills.forEach(function (sk) {
      var n = normSkill(sk);
      if (!n.name) return;
      (n.calibrated ? cal : unc).push(n);
    });

      rows.forEach(function (n) {

          : (n.preset && PRESET_BY_NAME[n.preset] ? "默认值,未校准" : "自评,未校准");

  h += "<div class=t><table><tr><th>#</th><th>学习项</th><th>月小时</th>" + (stripped ? "" : "<th>成本</th><th>预期年增收</th>") + "<th>时间ROI(元/小时)</th></tr>";

}

function download(name, text, type) {
  var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 300);
}

function bindPane5() {
  if (typeof window !== "undefined" && window.beacon) { try { window.beacon("report_generated"); } catch (e) {} }
  $("btn_save").onclick = function () { download("饭碗雷达-报告-" + dateTag() + ".html", reportHtml(false)); if (typeof window !== "undefined" && window.beacon) { try { window.beacon("report_saved"); } catch (e) {} } };
  $("btn_share").onclick = function () { download("饭碗雷达-分享页-" + dateTag() + ".html", reportHtml(true)); if (typeof window !== "undefined" && window.beacon) { try { window.beacon("share_clicked"); } catch (e) {} } };
  $("btn_reset").onclick = function () {
    if (!window.confirm("确定清空所有输入并重新开始吗?本机保存的数据将被删除,且无法恢复。")) return;
    try { localStorage.removeItem("gyz_planner_v1"); } catch (e) {}
    location.reload();
  };
}

function navButtons() {
  var n = el("div", "navbtns");
  var prev = el("button", "btn", "上一步");
  prev.onclick = function () { if (cur > 0) { cur--; render(); } };
  var next = el("button", "btn primary", cur === STEP_NAMES.length - 1 ? "回到开头" : "下一步 →");
  next.onclick = function () { if (cur < STEP_NAMES.length - 1) { cur++; render(); } else { cur = 0; render(); } };
  n.appendChild(prev);
  n.appendChild(next);
  return n;
}

var PANES = [pane1, pane2, pane3, pane4, pane5];
var BINDS = [bindPane1, bindPane2, bindPane3, bindPane4, bindPane5];

/* P3:步骤切换走 View Transitions(带降级;首屏渲染不触发,保证 LCP) */
var RENDERED_ONCE = false;
function renderInner() {
  renderSteps();
  $("pane").innerHTML = "";
  $("pane").appendChild(PANES[cur]());
  BINDS[cur]();
  window.scrollTo({ top: 0, behavior: "auto" });
}
function render() {
  /* 页面隐藏/后台标签页时 View Transition 会被浏览器中止,直接同步渲染并吞掉 rejection */
  var canVT = typeof document.startViewTransition === "function" && RENDERED_ONCE && !reduceMotion() && !document.hidden;
  RENDERED_ONCE = true;
  if (canVT) {
    try {
      document.startViewTransition(renderInner).catch(function () {});
    } catch (err) {
      renderInner();
    }
  } else {
    renderInner();
  }
}

initTheme();
loadOccupations();
load();
render();
